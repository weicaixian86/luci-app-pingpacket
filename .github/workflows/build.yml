name: Build luci-app-pingpacket for OpenWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "版本号（例如 2.0.0；不需要 v 前缀）"
        type: string
        required: true
      description:
        description: "Release 描述（可选，默认留空）"
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  PACKAGE_NAME: luci-app-pingpacket

jobs:
  build:
    name: Build ${{ matrix.openwrt_version }} ${{ matrix.target_slug }} ${{ matrix.package_ext }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_version: "24.10.0"
            openwrt_target: "x86/64"
            target_slug: "x86_64"
            sdk_url: "https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            package_ext: "ipk"
            artifact_name: "openwrt-24.10.0-x86_64-ipk"
          - openwrt_version: "25.12.0"
            openwrt_target: "x86/64"
            target_slug: "x86_64"
            sdk_url: "https://downloads.openwrt.org/releases/25.12.0/targets/x86/64/openwrt-sdk-25.12.0-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            package_ext: "apk"
            artifact_name: "openwrt-25.12.0-x86_64-apk"
    env:
      OPENWRT_VERSION: ${{ matrix.openwrt_version }}
      OPENWRT_TARGET: ${{ matrix.openwrt_target }}
      TARGET_SLUG: ${{ matrix.target_slug }}
      SDK_URL: ${{ matrix.sdk_url }}
      PACKAGE_EXT: ${{ matrix.package_ext }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set package version from release tag
        shell: bash
        env:
          RAW_INPUT: ${{ github.event.inputs.tag }}
        run: |
          # 输入框里填的是纯版本号（2.0.0），仓库既有 tag 习惯是带 v 前缀，
          # 这里统一补上；万一手滑填了 v2.0.0 也不会变成 vv2.0.0。
          VERSION="${RAW_INPUT#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION# }"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*([-+~][0-9A-Za-z.+~-]+)?$'; then
            echo "::error::invalid version '$RAW_INPUT'; expected something like 2.0.0"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "RAW_TAG=$TAG" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION (tag: $TAG)"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib \
            genisoimage gettext git gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            lrzsz mkisofs msmtp nano ninja-build p7zip-full patch pkgconf python3 python3-pip \
            python3-ply python3-docutils qemu-utils rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Download OpenWrt SDK
        shell: bash
        run: |
          wget -q -O openwrt-sdk.tar.zst "$SDK_URL"
          mkdir -p sdk
          tar --zstd -xf openwrt-sdk.tar.zst -C sdk --strip-components=1

      - name: Prepare OpenWrt feeds
        shell: bash
        run: |
          cd sdk
          FEEDS_BRANCH="openwrt-${OPENWRT_VERSION%.*}"
          {
            printf 'src-git packages https://git.openwrt.org/feed/packages.git;%s\n' "$FEEDS_BRANCH"
            printf 'src-git luci https://git.openwrt.org/project/luci.git;%s\n' "$FEEDS_BRANCH"
          } > feeds.conf.default
          ./scripts/feeds update packages luci
          # libcurl 的 DEPENDS 含 +LIBCURL_HTTP2:libnghttp2，feeds 里必须 install 才可见
          ./scripts/feeds install curl libnghttp2
          ./scripts/feeds install -p luci luci-base luci-lua-runtime luci-compat
          # SDK 的 package/ 只保留 toolchain 与 kernel/linux，lua/ucode 及其构建依赖
          # 都必须从 openwrt 基础源码树补进来。ucode(85922056) 的 CMake 检查项：
          #   pkg_check_modules: json-c(REQUIRED) / libmd(REQUIRED) / zlib(可选)
          #   find_path: libubox/uloop.h、libubox/ulog.h、libubus.h、uci.h、
          #              netlink/msg.h(PATH_SUFFIXES libnl-tiny)
          # luci-base 依赖链：rpcd-mod-luci 的 PKG_BUILD_DEPENDS:=iwinfo（iwinfo.h），
          # 其源码还 #include <rpcd/plugin.h>，该头由 rpcd 的 Build/InstallDev
          # 装到 staging_dir/usr/include/rpcd，但 rpcd 未声明为构建依赖，需手工补
          # curl 的 TLS 后端由 feeds/net/curl/Config.in 决定，默认 LIBCURL_MBEDTLS，
          # 其 DEPENDS 为 +libmbedtls；SDK 里同样没有 package/libs/mbedtls，
          # 缺它会让 curl configure 直接报 "TLS not detected"。另外 libcurl 的
          # DEPENDS 里还有无条件依赖 +ca-bundle，该包由 package/system/ca-certificates
          # 提供；缺它会让 libcurl 变成不可选，进而整个依赖链被静默丢弃。
          BASE_PKGS="utils/lua utils/ucode libs/libjson-c libs/zlib libs/libmd libs/libnl-tiny libs/libubox system/uci system/ubus network/utils/iwinfo system/rpcd libs/mbedtls system/ca-certificates"
          MISSING=""
          for pkg in $BASE_PKGS; do
            [ -f "package/$pkg/Makefile" ] || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            echo "Provisioning from openwrt source:$MISSING"
            git clone \
              --depth 1 \
              --filter=blob:none \
              --sparse \
              --branch "$FEEDS_BRANCH" \
              https://github.com/openwrt/openwrt.git \
              ../openwrt-source
            # shellcheck disable=SC2046
            git -C ../openwrt-source sparse-checkout set \
              $(for pkg in $BASE_PKGS; do printf 'package/%s ' "$pkg"; done)
            for pkg in $MISSING; do
              mkdir -p "package/$(dirname "$pkg")"
              cp -a "../openwrt-source/package/$pkg" "package/$(dirname "$pkg")/"
            done
          fi
          for pkg in $BASE_PKGS; do
            if [ ! -f "package/$pkg/Makefile" ]; then
              echo "::error::package/$pkg is missing from the SDK tree"
              exit 1
            fi
          done
          echo "Base packages ready: $BASE_PKGS"

      - name: Detect package source dir
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/Makefile" ] && grep -q "^PKG_NAME:=${PACKAGE_NAME}$" "$GITHUB_WORKSPACE/Makefile"; then
            APP_SOURCE_DIR="."
          elif [ -f "$GITHUB_WORKSPACE/${PACKAGE_NAME}/Makefile" ] && grep -q "^PKG_NAME:=${PACKAGE_NAME}$" "$GITHUB_WORKSPACE/${PACKAGE_NAME}/Makefile"; then
            APP_SOURCE_DIR="${PACKAGE_NAME}"
          else
            echo "Unable to locate package source directory"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -name Makefile | sort
            exit 1
          fi
          SDK_PACKAGE_DIR="$GITHUB_WORKSPACE/sdk/package/${PACKAGE_NAME}"
          PACKAGE_BUILD_TARGET="package/${PACKAGE_NAME}/compile"
          echo "APP_SOURCE_DIR=$APP_SOURCE_DIR" >> "$GITHUB_ENV"
          echo "SDK_PACKAGE_DIR=$SDK_PACKAGE_DIR" >> "$GITHUB_ENV"
          echo "PACKAGE_BUILD_TARGET=$PACKAGE_BUILD_TARGET" >> "$GITHUB_ENV"
          echo "Resolved APP_SOURCE_DIR=$APP_SOURCE_DIR"
          echo "Resolved SDK_PACKAGE_DIR=$SDK_PACKAGE_DIR"
          echo "Resolved PACKAGE_BUILD_TARGET=$PACKAGE_BUILD_TARGET"

      - name: Apply package version to Makefile
        shell: bash
        run: |
          sed -i -E "s/^PKG_VERSION:=.*/PKG_VERSION:=${PACKAGE_VERSION}/" "$GITHUB_WORKSPACE/${APP_SOURCE_DIR}/Makefile"
          grep -E "^PKG_NAME:=|^PKG_VERSION:=|^PKG_RELEASE:=" "$GITHUB_WORKSPACE/${APP_SOURCE_DIR}/Makefile"

      - name: Stage package into SDK package dir
        shell: bash
        run: |
          rm -rf "$SDK_PACKAGE_DIR"
          mkdir -p "$SDK_PACKAGE_DIR"
          rsync -a \
            --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'sdk' \
            --exclude 'output' \
            "$GITHUB_WORKSPACE/${APP_SOURCE_DIR}/" "$SDK_PACKAGE_DIR/"
          test -f "$SDK_PACKAGE_DIR/Makefile"
          grep -E "^PKG_NAME:=|^PKG_VERSION:=|^PKG_RELEASE:=" "$SDK_PACKAGE_DIR/Makefile"
          find "$GITHUB_WORKSPACE/sdk/package" -maxdepth 3 -path "*/${PACKAGE_NAME}/Makefile" | sort

      - name: Build package
        shell: bash
        run: |
          set -o pipefail
          cd sdk
          {
            echo "CONFIG_PACKAGE_liblua=y"
            echo "CONFIG_PACKAGE_lua=y"
            echo "CONFIG_PACKAGE_libjson-c=y"
            echo "CONFIG_PACKAGE_zlib=y"
            echo "CONFIG_PACKAGE_libmd=y"
            echo "CONFIG_PACKAGE_libnl-tiny=y"
            echo "CONFIG_PACKAGE_libubox=y"
            echo "CONFIG_PACKAGE_libuci=y"
            echo "CONFIG_PACKAGE_ubus=y"
            echo "CONFIG_PACKAGE_iwinfo=y"
            echo "CONFIG_PACKAGE_libiwinfo=y"
            echo "CONFIG_PACKAGE_rpcd=y"
            echo "CONFIG_PACKAGE_libucode=y"
            echo "CONFIG_PACKAGE_ucode=y"
            echo "CONFIG_PACKAGE_libmbedtls=y"
            echo "CONFIG_LIBCURL_MBEDTLS=y"
            echo "CONFIG_LIBCURL_HTTP2=y"
            echo "CONFIG_PACKAGE_libnghttp2=y"
            echo "CONFIG_PACKAGE_ca-bundle=y"
            echo "CONFIG_PACKAGE_libcurl=y"
            echo "CONFIG_PACKAGE_curl=y"
          } >> .config
          make defconfig
          # make defconfig 会把依赖不满足的包静默丢弃（例如 ca-bundle 不在树里时
          # libcurl 直接消失），此时后续的 make 既不报错也不编译该包，最终只在
          # app 编译末尾抛一句很难定位的 "required packages were not found"。
          # 这里提前断言关键开关真的被选中，把问题变成一行明确的提示。
          REQUIRED_CONF="CONFIG_PACKAGE_libmbedtls CONFIG_LIBCURL_MBEDTLS CONFIG_LIBCURL_HTTP2 CONFIG_PACKAGE_libnghttp2 CONFIG_PACKAGE_ca-bundle CONFIG_PACKAGE_libcurl CONFIG_PACKAGE_curl"
          MISSING_CONF=""
          for sym in $REQUIRED_CONF; do
            grep -qx "${sym}=y" .config || MISSING_CONF="$MISSING_CONF $sym"
          done
          if [ -n "$MISSING_CONF" ]; then
            echo "::error::defconfig dropped required symbols:$MISSING_CONF"
            for sym in $MISSING_CONF; do
              grep -nE "^# ${sym} is not set|^${sym}=" .config || true
            done
            exit 1
          fi
          echo "Required config symbols confirmed: $REQUIRED_CONF"
          make package/utils/lua/compile V=sc -j"$(nproc)" 2>&1 | tee "build-lua.log"
          # 基础库必须先编译进 staging_dir，否则 ucode 的 CMake/pkg-config 找不到它们：
          # libmd 是 PKG_BUILD_DEPENDS，libjson-c 是 HOST_BUILD_DEPENDS/DEPENDS，
          # libubox/ubus 提供 uloop.h、ulog.h、libubus.h，
          # libnl-tiny 提供 netlink/msg.h（装到 include/libnl-tiny），zlib 可选；
          # iwinfo 提供 iwinfo.h，rpcd-mod-luci 的 PKG_BUILD_DEPENDS 需要它；
          # rpcd 提供 usr/include/rpcd/plugin.h，rpcd-mod-luci 直接 include；
          # mbedtls 是 libcurl 默认 TLS 后端（LIBCURL_MBEDTLS）的 DEPENDS，
          # 必须先装进 staging_dir，否则 curl configure 报 "TLS not detected"；
          # ca-certificates 提供 ca-bundle，是 libcurl 的无条件 DEPENDS
          BASE_BUILD="libs/libjson-c libs/zlib libs/libmd libs/libnl-tiny libs/libubox system/uci system/ubus network/utils/iwinfo system/rpcd libs/mbedtls system/ca-certificates"
          for dep in $BASE_BUILD; do
            if [ ! -f "package/$dep/Makefile" ]; then
              echo "::error::required base package $dep is missing"
              exit 1
            fi
            make "package/$dep/compile" V=sc -j"$(nproc)" 2>&1 | tee "build-$(basename "$dep").log"
          done
          # feeds 里的包走 package/feeds/<feed>/<源码包名>；libnghttp2 的源码包名是
          # nghttp2。curl 用 --with-nghttp2=$(STAGING_DIR)/usr，显式路径找不到会直接
          # 报 "HTTP/2 support not found"，所以必须在 curl 之前编好
          for dep in nghttp2 curl; do
            if [ ! -f "package/feeds/packages/$dep/Makefile" ]; then
              echo "::error::required feed package $dep is missing"
              exit 1
            fi
            make "package/feeds/packages/$dep/compile" V=sc -j"$(nproc)" 2>&1 | tee "build-$dep.log"
          done
          make package/utils/ucode/compile V=sc -j"$(nproc)" 2>&1 | tee "build-ucode.log"
          echo "Using BUILD_TARGET=$PACKAGE_BUILD_TARGET"
          if ! make "$PACKAGE_BUILD_TARGET" V=sc -j"$(nproc)" 2>&1 | tee "build-${PACKAGE_NAME}.log"; then
            echo "Parallel build failed; retrying serially so the real error is visible."
            make "$PACKAGE_BUILD_TARGET" V=sc -j1 2>&1 | tee -a "build-${PACKAGE_NAME}.log"
          fi

      - name: Dump package build logs on failure
        if: failure()
        shell: bash
        run: |
          for log in sdk/build-*.log; do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            tail -n 400 "$log"
          done
          echo "===== likely errors ====="
          grep -nEi "(^|[^[:alpha:]])(error|fatal|failed|no rule|undefined reference|cannot find|required packages were not found)([^[:alpha:]]|$)" sdk/build-*.log 2>/dev/null | tail -n 120 || true
          echo "===== possible package logs ====="
          find sdk/build_dir -type f \( -name "*.log" -o -name "config.err" -o -name "CMakeError.log" -o -name "CMakeOutput.log" \) | sort || true

      - name: Collect package files
        shell: bash
        run: |
          mkdir -p output
          mapfile -t package_files < <(find sdk/bin -type f \( -name "${PACKAGE_NAME}_*.${PACKAGE_EXT}" -o -name "${PACKAGE_NAME}-*.${PACKAGE_EXT}" \) | sort)
          test "${#package_files[@]}" -gt 0
          main_package="${package_files[0]}"
          output_name="${PACKAGE_NAME}_${RAW_TAG}_all.${PACKAGE_EXT}"
          cp -f "$main_package" "output/$output_name"
          ls -lah output

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: output/*.${{ matrix.package_ext }}
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-dist
          find release-assets -type f -exec cp -f {} release-dist/ \;
          test -n "$(find release-dist -maxdepth 1 -type f | head -n 1)"
          ls -lah release-dist

      - name: Set release metadata
        shell: bash
        env:
          RAW_INPUT: ${{ github.event.inputs.tag }}
          RELEASE_DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          # release job 没有 checkout，拿不到 build job 里写进 GITHUB_ENV 的
          # RAW_TAG，所以这里按同样规则重新归一化一次。
          VERSION="${RAW_INPUT#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION# }"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*([-+~][0-9A-Za-z.+~-]+)?$'; then
            echo "::error::invalid version '$RAW_INPUT'; expected something like 2.0.0"
            exit 1
          fi
          TAG="v${VERSION}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          BUILD_TIME="$(date '+%Y-%m-%d %H:%M:%S %Z')"
          {
            echo "RELEASE_BODY<<EOF"
            if [ -n "$RELEASE_DESCRIPTION" ]; then
              printf '%s\n\n' "$RELEASE_DESCRIPTION"
            fi
            printf 'Build time: %s\n' "$BUILD_TIME"
            printf 'Artifacts:\n'
            find release-dist -maxdepth 1 -type f -printf '%f\n' | sort | while IFS= read -r file; do
              printf -- '- %s\n' "$file"
            done
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Remove existing release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          delete_release: true
          tag_name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: ${{ env.RELEASE_BODY }}
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: false
          append_body: false
          make_latest: true
